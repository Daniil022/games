<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/games/sw.js");
    }
    </script>
    <script src="theme.js"></script>
    <script src="profile.js"></script>
    <title>🌍 Гео-викторина — Игровой портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #1f6feb;
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 14px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { font-size: 26px; color: #58a6ff; margin-bottom: 6px; }
        .progress-bar {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: #58a6ff; transition: width 0.4s; }
        .question { font-size: 18px; font-weight: 600; margin: 16px 0; }
        .answers { display: flex; flex-direction: column; gap: 8px; }
        .ans-btn {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: all 0.2s;
        }
        .ans-btn.correct { background: #1a3a2a; border-color: #238636; color: #7ee787; }
        .ans-btn.wrong { background: #3a1a1a; border-color: #f85149; color: #ff7b72; }
        .result-screen { display: none; }
        .result-screen.show { display: block; }
        .result-emoji { font-size: 60px; }
        .result-text { font-size: 20px; font-weight: 700; margin: 10px 0; }
        .btn { padding: 10px 20px; background: #30363d; color: #c9d1d9; border: 1px solid #484f58; border-radius: 8px; cursor: pointer; margin: 4px; }
        .btn-restart { background: #58a6ff; color: #fff; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Назад к играм</a>
        <h1>🌍 Гео-викторина</h1>
        
        <div id="quizScreen">
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <p style="font-size:13px;color:#8b949e;">Вопрос <span id="qNum">1</span>/15</p>
            <div class="question" id="question"></div>
            <div class="answers" id="answers"></div>
        </div>
        
        <div class="result-screen" id="resultScreen">
            <div class="result-emoji" id="resultEmoji"></div>
            <div class="result-text" id="resultText"></div>
            <p id="resultScore" style="margin-bottom:14px;"></p>
            <button class="btn btn-restart" onclick="restart()">🔄 Ещё раз</button>
        </div>
    </div>

    <script>
        var questions = [
            { q: 'Столица Франции?', a: ['Лондон', 'Париж', 'Берлин', 'Мадрид'], c: 1 },
            { q: 'Самая большая страна по площади?', a: ['Китай', 'США', 'Россия', 'Канада'], c: 2 },
            { q: 'На каком континенте находится Египет?', a: ['Азия', 'Европа', 'Африка', 'Австралия'], c: 2 },
            { q: 'Самая длинная река в мире?', a: ['Амазонка', 'Нил', 'Янцзы', 'Миссисипи'], c: 1 },
            { q: 'Сколько океанов на Земле?', a: ['3', '4', '5', '6'], c: 2 },
            { q: 'Столица Японии?', a: ['Сеул', 'Пекин', 'Токио', 'Бангкок'], c: 2 },
            { q: 'Самое глубокое озеро?', a: ['Байкал', 'Танганьика', 'Каспийское', 'Виктория'], c: 0 },
            { q: 'Где находятся Великие озёра?', a: ['Европа', 'Северная Америка', 'Азия', 'Африка'], c: 1 },
            { q: 'Столица Бразилии?', a: ['Рио', 'Сан-Паулу', 'Бразилиа', 'Сальвадор'], c: 2 },
            { q: 'Самое маленькое государство?', a: ['Монако', 'Ватикан', 'Сан-Марино', 'Андорра'], c: 1 },
            { q: 'Какая пустыня самая большая?', a: ['Сахара', 'Гоби', 'Антарктическая', 'Калахари'], c: 2 },
            { q: 'Столица Австралии?', a: ['Сидней', 'Мельбурн', 'Канберра', 'Перт'], c: 2 },
            { q: 'Самый высокий водопад?', a: ['Ниагара', 'Анхель', 'Виктория', 'Игуасу'], c: 1 },
            { q: 'На каком материке нет постоянного населения?', a: ['Африка', 'Антарктида', 'Австралия', 'Азия'], c: 1 },
            { q: 'Пролив между Англией и Францией?', a: ['Гибралтар', 'Ла-Манш', 'Босфор', 'Магелланов'], c: 1 }
        ];

        var current = 0;
        var score = 0;
        var answered = false;

        function showQuestion() {
            answered = false;
            var q = questions[current];
            document.getElementById('qNum').textContent = current + 1;
            document.getElementById('progressFill').style.width = (current / questions.length * 100) + '%';
            document.getElementById('question').textContent = q.q;
            var ansBox = document.getElementById('answers');
            ansBox.innerHTML = '';
            for (var i = 0; i < q.a.length; i++) {
                var btn = document.createElement('button');
                btn.className = 'ans-btn';
                btn.textContent = (i+1) + '. ' + q.a[i];
                btn.addEventListener('click', (function(idx) { return function() { check(idx); }; })(i));
                ansBox.appendChild(btn);
            }
        }

        function check(idx) {
            if (answered) return;
            answered = true;
            var q = questions[current];
            var btns = document.querySelectorAll('.ans-btn');
            btns[q.c].classList.add('correct');
            if (idx === q.c) { score++; btns[idx].classList.add('correct'); }
            else btns[idx].classList.add('wrong');
            setTimeout(function() {
                current++;
                if (current < questions.length) showQuestion();
                else showResult();
            }, 800);
        }

        function showResult() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');
            var p = score / questions.length * 100;
            var e, t;
            if (p === 100) { e = '🏆'; t = 'Идеально! Ты знаток географии!'; }
            else if (p >= 70) { e = '🌍'; t = 'Отлично! Хорошие знания!'; }
            else if (p >= 40) { e = '🗺️'; t = 'Неплохо, но есть куда расти.'; }
            else { e = '📚'; t = 'Стоит подучить географию!'; }
            document.getElementById('resultEmoji').textContent = e;
            document.getElementById('resultText').textContent = t;
            document.getElementById('resultScore').textContent = score + ' / ' + questions.length;
        }

        function restart() {
            current = 0; score = 0;
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            showQuestion();
        }

        showQuestion();
    </script>
<button id="themeToggle" onclick="toggleTheme()" style="position:fixed;bottom:16px;right:16px;z-index:999;padding:10px 14px;border-radius:20px;background:#30363d;color:#c9d1d9;border:1px solid #484f58;cursor:pointer;font-size:14px;">Theme</button>
</body>
</html>
