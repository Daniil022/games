<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Однорукий бандит — Игровой портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(180deg, #1a0a0a, #161b22);
            border: 2px solid #f0883e;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(240,136,62,0.3);
        }
        .back-btn {
            display: inline-block;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 14px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { font-size: 28px; color: #f0883e; margin-bottom: 6px; }
        .balance { font-size: 20px; font-weight: 700; color: #7ee787; margin-bottom: 14px; }
        .reels {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .reel {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 14px;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .reel.spinning { animation: shakeX 0.08s infinite; }
        @keyframes shakeX {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .btn-spin {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f0883e, #d29922);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            box-shadow: 0 6px 20px rgba(240,136,62,0.5);
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
        .win-message { font-size: 18px; font-weight: 700; min-height: 28px; margin-top: 10px; }
        .win-big { color: #f0883e; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse {
            from { text-shadow: 0 0 5px #f0883e; }
            to { text-shadow: 0 0 20px #f0883e, 0 0 40px #d29922; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Назад к играм</a>
        <h1>🎰 Однорукий бандит</h1>
        <p class="balance">💰 Баланс: <span id="balance">1000</span> монет</p>
        
        <div class="reels">
            <div class="reel" id="reel0">🍒</div>
            <div class="reel" id="reel1">🍋</div>
            <div class="reel" id="reel2">🍊</div>
        </div>
        
        <p class="win-message" id="winMessage"></p>
        
        <button class="btn-spin" id="spinBtn" onclick="spin()">🎰 КРУТИТЬ (50 монет)</button>
        <p style="font-size:12px;color:#8b949e;margin-top:10px;">
            🍒×3 = 200 | 🍋×3 = 300 | 🍊×3 = 400 | 💎×3 = 1000<br>
            Два одинаковых = 100
        </p>
    </div>

    <script>
        var symbols = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣', '⭐'];
        var balance = 1000;
        var spinning = false;

        function spin() {
            if (spinning) return;
            if (balance < 50) {
                alert('Недостаточно монет! Пополни баланс.');
                return;
            }
            balance -= 50;
            updateBalance();
            spinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('winMessage').textContent = '';
            document.getElementById('winMessage').className = 'win-message';

            var reels = document.querySelectorAll('.reel');
            reels.forEach(function(r) { r.classList.add('spinning'); });

            var results = [];
            var spinsLeft = 20;
            var interval = setInterval(function() {
                for (var i = 0; i < 3; i++) {
                    document.getElementById('reel' + i).textContent = symbols[Math.floor(Math.random() * symbols.length)];
                }
                spinsLeft--;
                if (spinsLeft <= 0) {
                    clearInterval(interval);
                    // Финальный результат
                    results = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    for (var i = 0; i < 3; i++) document.getElementById('reel' + i).textContent = results[i];
                    reels.forEach(function(r) { r.classList.remove('spinning'); });
                    checkWin(results);
                    spinning = false;
                    document.getElementById('spinBtn').disabled = false;
                }
            }, 80);
        }

        function checkWin(results) {
            var win = 0;
            var msg = '';
            var cls = 'win-message';
            if (results[0] === results[1] && results[1] === results[2]) {
                if (results[0] === '💎') win = 1000;
                else if (results[0] === '🍊') win = 400;
                else if (results[0] === '🍋') win = 300;
                else if (results[0] === '🍒') win = 200;
                else if (results[0] === '7️⃣') win = 777;
                else win = 250;
                msg = '🎉 ДЖЕКПОТ! +' + win;
                cls = 'win-message win-big';
            } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                win = 100;
                msg = '👍 Два совпадения! +' + win;
            } else {
                msg = '😞 Попробуй ещё раз';
            }
            balance += win;
            updateBalance();
            document.getElementById('winMessage').textContent = msg;
            document.getElementById('winMessage').className = cls;
        }

        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }
    </script>
</body>
</html>
