<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔢 2048 — Игровой портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 12px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { font-size: 26px; color: #f0f6fc; margin-bottom: 8px; }
        .score-panel {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 14px;
        }
        .score-box {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 16px;
        }
        .score-label { font-size: 11px; color: #8b949e; }
        .score-value { font-size: 20px; font-weight: 900; color: #f0f6fc; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 300px;
            height: 300px;
            margin: 0 auto 14px;
            background: #0d1117;
            border-radius: 10px;
            padding: 8px;
        }
        .tile {
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            transition: all 0.15s;
            aspect-ratio: 1;
        }
        .tile-0 { background: #21262d; }
        .tile-2 { background: #1a2332; color: #c9d1d9; }
        .tile-4 { background: #1a2b3c; color: #c9d1d9; }
        .tile-8 { background: #f0883e; color: #fff; }
        .tile-16 { background: #f85149; color: #fff; }
        .tile-32 { background: #d32f2f; color: #fff; }
        .tile-64 { background: #f00; color: #fff; }
        .tile-128 { background: #d29922; color: #fff; font-size: 20px; }
        .tile-256 { background: #d29922; color: #fff; font-size: 20px; }
        .tile-512 { background: #d29922; color: #fff; font-size: 18px; }
        .tile-1024 { background: #7ee787; color: #000; font-size: 16px; }
        .tile-2048 { background: #238636; color: #fff; font-size: 16px; }
        .message { font-size: 18px; font-weight: 700; min-height: 28px; margin-bottom: 8px; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: #f0883e;
            color: #fff;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Назад к играм</a>
        <h1>🔢 2048</h1>
        <div class="score-panel">
            <div class="score-box"><div class="score-label">Счёт</div><div class="score-value" id="score">0</div></div>
            <div class="score-box"><div class="score-label">Рекорд</div><div class="score-value" id="best">0</div></div>
        </div>
        <div class="board" id="board"></div>
        <p class="message" id="message"></p>
        <button class="btn" onclick="newGame()">🔄 Новая игра</button>
    </div>

    <script>
        var grid = [];
        var score = 0;
        var best = parseInt(localStorage.getItem('best2048') || '0');

        function newGame() {
            grid = Array(4).fill().map(function() { return Array(4).fill(0); });
            score = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('best').textContent = best;
            document.getElementById('message').textContent = '';
            addTile();
            addTile();
            render();
        }

        function addTile() {
            var empty = [];
            for (var r = 0; r < 4; r++)
                for (var c = 0; c < 4; c++)
                    if (grid[r][c] === 0) empty.push({r: r, c: c});
            if (empty.length === 0) return;
            var pos = empty[Math.floor(Math.random() * empty.length)];
            grid[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            var boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (var r = 0; r < 4; r++) {
                for (var c = 0; c < 4; c++) {
                    var tile = document.createElement('div');
                    tile.className = 'tile tile-' + grid[r][c];
                    tile.textContent = grid[r][c] || '';
                    boardEl.appendChild(tile);
                }
            }
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('best2048', best);
                document.getElementById('best').textContent = best;
            }
        }

        function move(direction) {
            var moved = false;
            var oldGrid = grid.map(function(r) { return r.slice(); });

            if (direction === 'left') {
                for (var r = 0; r < 4; r++) {
                    var row = grid[r].filter(function(v) { return v !== 0; });
                    for (var i = 0; i < row.length - 1; i++) {
                        if (row[i] === row[i + 1]) {
                            row[i] *= 2;
                            score += row[i];
                            row.splice(i + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    grid[r] = row;
                }
            } else if (direction === 'right') {
                for (var r = 0; r < 4; r++) {
                    var row = grid[r].filter(function(v) { return v !== 0; });
                    for (var i = row.length - 1; i > 0; i--) {
                        if (row[i] === row[i - 1]) {
                            row[i] *= 2;
                            score += row[i];
                            row.splice(i - 1, 1);
                            i--;
                        }
                    }
                    while (row.length < 4) row.unshift(0);
                    grid[r] = row;
                }
            } else if (direction === 'up') {
                for (var c = 0; c < 4; c++) {
                    var col = [];
                    for (var r = 0; r < 4; r++) if (grid[r][c] !== 0) col.push(grid[r][c]);
                    for (var i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            score += col[i];
                            col.splice(i + 1, 1);
                        }
                    }
                    while (col.length < 4) col.push(0);
                    for (var r = 0; r < 4; r++) grid[r][c] = col[r];
                }
            } else if (direction === 'down') {
                for (var c = 0; c < 4; c++) {
                    var col = [];
                    for (var r = 0; r < 4; r++) if (grid[r][c] !== 0) col.push(grid[r][c]);
                    for (var i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            score += col[i];
                            col.splice(i - 1, 1);
                            i--;
                        }
                    }
                    while (col.length < 4) col.unshift(0);
                    for (var r = 0; r < 4; r++) grid[r][c] = col[r];
                }
            }

            for (var r = 0; r < 4; r++)
                for (var c = 0; c < 4; c++)
                    if (grid[r][c] !== oldGrid[r][c]) moved = true;

            if (moved) {
                addTile();
                render();
                if (checkWin()) document.getElementById('message').textContent = '🏆 2048! Продолжай!';
                if (checkLose()) document.getElementById('message').textContent = '😞 Нет ходов!';
            }
        }

        function checkWin() {
            for (var r = 0; r < 4; r++)
                for (var c = 0; c < 4; c++)
                    if (grid[r][c] === 2048) return true;
            return false;
        }

        function checkLose() {
            for (var r = 0; r < 4; r++)
                for (var c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            return true;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
            e.preventDefault();
        });

        var touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', function(e) {
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
            else move(dy > 0 ? 'down' : 'up');
        });

        newGame();
    </script>
</body>
</html>
