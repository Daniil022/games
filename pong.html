<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏓 Пинг-понг — Игровой портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        .back-btn {
            display: inline-block;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 12px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 8px; }
        .score { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
        .score-p1 { color: #58a6ff; }
        .score-p2 { color: #f85149; }
        canvas {
            border: 2px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            display: block;
            margin: 0 auto;
        }
        .controls-info {
            font-size: 13px;
            color: #8b949e;
            margin-top: 8px;
        }
        .btn {
            margin-top: 8px;
            padding: 10px 20px;
            background: #30363d;
            color: #c9d1d9;
            border: 1px solid #484f58;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
