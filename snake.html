<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/games/sw.js");
    }
    </script>
    <script src="theme.js"></script>
    <script src="profile.js"></script>
    <title>🐍 Змейка — Игровой портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 14px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { font-size: 26px; margin-bottom: 4px; color: #f0f6fc; }
        .score { font-size: 18px; font-weight: 700; color: #238636; margin: 10px 0; }
        canvas {
            border: 2px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            display: block;
            margin: 10px auto;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            max-width: 200px;
            margin: 14px auto 0;
        }
        .ctrl-btn {
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }
        .ctrl-btn:active { background: #1f6feb; }
        .btn-restart {
            margin-top: 12px;
            padding: 10px 20px;
            background: #30363d;
            color: #c9d1d9;
            border: 1px solid #484f58;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Назад к играм</a>
        <h1>🐍 Змейка</h1>
        <p class="score">Счёт: <span id="score">0</span></p>
        <canvas id="canvas" width="300" height="300"></canvas>
        
        <!-- Мобильное управление -->
        <div class="controls">
            <div></div>
            <button class="ctrl-btn" onclick="changeDir(0, -1)">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="changeDir(-1, 0)">◀</button>
            <button class="ctrl-btn" onclick="changeDir(0, 1)">▼</button>
            <button class="ctrl-btn" onclick="changeDir(1, 0)">▶</button>
        </div>
        <button class="btn-restart" onclick="resetGame()">🔄 Заново</button>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var gridSize = 15;
        var tileSize = canvas.width / gridSize;
        var snake = [{x: 7, y: 7}];
        var food = {x: 10, y: 10};
        var dir = {x: 1, y: 0};
        var score = 0;
        var gameOver = false;
        var gameLoop;
        
        function changeDir(dx, dy) {
            if ((dir.x !== -dx || dir.y !== -dy) && !(dx === 0 && dy === 0)) {
                dir.x = dx;
                dir.y = dy;
            }
        }
        
        function spawnFood() {
            var pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
            } while (snake.some(function(s) { return s.x === pos.x && s.y === pos.y; }));
            food = pos;
        }
        
        function update() {
            if (gameOver) return;
            
            var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            
            // Стены
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                gameOver = true;
                clearInterval(gameLoop);
                alert('Игра окончена! Счёт: ' + score);
                return;
            }
            
            // Самопересечение
            if (snake.some(function(s) { return s.x === head.x && s.y === head.y; })) {
                gameOver = true;
                clearInterval(gameLoop);
                alert('Игра окончена! Счёт: ' + score);
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Еда
            ctx.fillStyle = '#f85149';
            ctx.fillRect(food.x * tileSize + 2, food.y * tileSize + 2, tileSize - 4, tileSize - 4);
            
            // Змейка
            snake.forEach(function(seg, i) {
                ctx.fillStyle = i === 0 ? '#7ee787' : '#238636';
                ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
        }
        
        function resetGame() {
            clearInterval(gameLoop);
            snake = [{x: 7, y: 7}];
            dir = {x: 1, y: 0};
            score = 0;
            gameOver = false;
            document.getElementById('score').textContent = '0';
            spawnFood();
            draw();
            gameLoop = setInterval(update, 120);
        }
        
        // Клавиатура
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp') changeDir(0, -1);
            if (e.key === 'ArrowDown') changeDir(0, 1);
            if (e.key === 'ArrowLeft') changeDir(-1, 0);
            if (e.key === 'ArrowRight') changeDir(1, 0);
            e.preventDefault();
        });
        
        // Свайпы для мобильных
        var touchStart = {x: 0, y: 0};
        canvas.addEventListener('touchstart', function(e) {
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
        });
        canvas.addEventListener('touchend', function(e) {
            var dx = e.changedTouches[0].clientX - touchStart.x;
            var dy = e.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                changeDir(dx > 0 ? 1 : -1, 0);
            } else {
                changeDir(0, dy > 0 ? 1 : -1);
            }
        });
        
        resetGame();
    </script>
<button id="themeToggle" onclick="toggleTheme()" style="position:fixed;bottom:16px;right:16px;z-index:999;padding:10px 14px;border-radius:20px;background:#30363d;color:#c9d1d9;border:1px solid #484f58;cursor:pointer;font-size:14px;">Theme</button>
</body>
</html>
